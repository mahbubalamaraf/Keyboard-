.key.space svg{width:14px; height:14px}

.key.tab{background:none; height:34px; font-size:.85rem}
.key.tab.on{background:var(--acc); color:var(--ink)}

.kb.mond .row .key.b{background:#2a5aa3; color:#fff}
.kb.mond .row .key.r{background:#d4302f; color:#fff}
.kb.mond .row .key.w{background:#efece8; color:#111}
.kb.mond .row .key.k{background:#1b1d21; color:#f2f2f2}
.kb.mond .row .key:active{filter:brightness(.82)}
.kb.mond .row .key.on{outline:3px solid #fff; outline-offset:-3px}
.mk{color:transparent; font-style:normal; pointer-events:none}

    kb.appendChild(rw);
  });
  const bot = row();
  bot.appendChild(mondC(spKey("?123", false, () => { S.layer = "sym"; S.shift = false; render(); }, "w15", "চিহ্ন"), "r"));
  bot.appendChild(mondC(spKey(ic("smile"), false, () => { S.panel = "emoji"; render(); }, "", "ইমোজি"), "b"));
  bot.appendChild(mondC(letterKey([",", ";", ":", "?", "!", "'", '"'], true), "w"));
  bot.appendChild(mondC(spaceKey(), "k"));
  bot.appendChild(mondC(letterKey([".", "?", "!", ":", ";", "-"], true), "k"));
  bot.appendChild(mondC(spKey(ic("enter"), false, () => insert("\n"), "w15", "নতুন লাইন"), "r"));
  kb.appendChild(bot);
}
function mainRows(){
  const bn = S.lang === "bn", sym = S.layer === "sym";
  if (S.mond && !sym) return mondRows();
  const rows = sym ? [(bn ? BN : EN)[0], ...SYM] : (bn ? BN : EN);
  rows.forEach((r, i) => {
    const rw = row(i === 0 ? "dig" : (!sym && i === 2 ? "inset" : ""));
    if (i === 3 && !sym) rw.appendChild(spKey(ic("shift"), S.shift, () => { S.shift = !S.shift; render(); }, "w19", "শিফট"));
    r.forEach((d, j) => { const k = letterKey(d); if (S.mond) k.classList.add("ybkwrbwr"[(i + j) % 8]); rw.appendChild(k); });
    if ((i === 3 && !sym) || (sym && i === rows.length - 1)) rw.appendChild(backKey("w19"));
    kb.appendChild(rw);
  });
  const bot = row();
  bot.appendChild(spKey(bn ? "?১২৩" : "?123", sym, () => { S.layer = sym ? "main" : "sym"; S.shift = false; render(); }, "w15", "চিহ্ন"));
  bot.appendChild(spKey(ic("smile"), false, () => { S.panel = "emoji"; render(); }, "", "ইমোজি"));
  bot.appendChild(letterKey([",", ";", ":", "?", "!", "'", '"'], true));
  bot.appendChild(spaceKey());
  bot.appendChild(letterKey(bn ? ["।", "॥", ".", "?", "!"] : [".", "?", "!", ":", ";", "-"], true));
  bot.appendChild(spKey(ic("enter"), false, () => insert("\n"), "w15", "নতুন লাইন"));
  kb.appendChild(bot);
}
function panelBody(){
  if (S.panel === "emoji") {
    const tabs = row();
    EMOJI.forEach((c, i) => {
      const b = el("button", "key tab" + (i === S.cat ? " on" : ""), c[0]); b.type = "button";
      b.onclick = () => { S.cat = i; render(); }; tabs.appendChild(b);
    });
    kb.appendChild(tabs);
    const g = el("div", "emo");
    EMOJI[S.cat][1].split(" ").forEach(e => {
      const b = el("button", "key e", e); b.type = "button"; b.onclick = () => insert(e); g.appendChild(b);
    });
    kb.appendChild(g);
  } else if (S.panel === "font") {
    const l = el("div", "list");
    FONTS.forEach(([id, name, stack]) => {
      const ok = id !== "kalpurush" || hasFont("Kalpurush");
      const b = el("button", "key fnt"); b.type = "button";
      const n = el("span", "", name + (ok ? "" : " (ইনস্টল নেই)")), s = el("span", "", "কখগ আমি");
      s.style.fontFamily = id === "system" ? stack : stack + ",'Noto Sans Bengali'";
      b.append(n, s);
      if (id === S.font) b.style.outline = "3px solid var(--acc)";
      b.onclick = () => { if (!ok) { toast("এই ফন্ট ফোনে ইনস্টল করা নেই"); return; } setFont(id); render(); };
      l.appendChild(b);
    });
    kb.appendChild(l);
  } else if (S.panel === "theme") {
    const g = el("div", "list themes");
    THEMES.forEach(([id, name, bg, fg]) => {
      const b = el("button", "key", name); b.type = "button";
      b.style.background = bg; b.style.color = fg;
      if (id === S.theme) b.style.outline = "3px solid var(--acc)";
      b.onclick = () => { setTheme(id); render(); if (id === "mondrian") toast("এই থিম শুধু ইংরেজি কিবোর্ডে দেখাবে"); };
      g.appendChild(b);
    });
    kb.appendChild(g);
  } else {
    const l = el("div", "list");
    if (S.panel === "clip") {
      if (!clips.length) l.appendChild(el("p", "", "কিছু কপি করলে এখানে জমা হবে।"));
      clips.forEach(c => { const b = el("button", "key", c); b.type = "button"; b.onclick = () => insert(c); l.appendChild(b); });
    } else {
      [["সব লেখা কপি করুন", async () => {
        addClip(out.value);
        try { await navigator.clipboard.writeText(out.value); } catch (e) { out.select(); document.execCommand("copy"); }
        toast("কপি হয়েছে");
      }], ["সব লেখা মুছুন", () => { out.value = ""; out.focus(); toast("মুছে গেছে"); }]
      ].forEach(([t, fn]) => { const b = el("button", "key", t); b.type = "button"; b.onclick = fn; l.appendChild(b); });
    }
    kb.appendChild(l);
  }
  const bot = row();
  bot.appendChild(spKey(S.lang === "bn" ? "কখ" : "ABC", false, () => { S.panel = null; render(); }, "w15", "কিবোর্ডে ফিরুন"));
  bot.appendChild(spaceKey());
  bot.appendChild(backKey("w15"));
  bot.appendChild(spKey(ic("enter"), false, () => insert("\n"), "w15", "নতুন লাইন"));
  kb.appendChild(bot);
}
function voice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("এই ব্রাউজারে ভয়েস টাইপিং নেই"); return; }
  if (S.listen) { rec && rec.stop(); return; }
  rec = new SR(); rec.lang = S.lang === "bn" ? "bn-BD" : "en-US";
  rec.onresult = e => insert(e.results[0][0].transcript + " ");
  rec.onend = () => { S.listen = false; render(); };
  rec.onerror = () => toast("ভয়েস চালু করা যায়নি");
  try { rec.start(); S.listen = true; render(); } catch (e) { toast("ভয়েস চালু করা যায়নি"); }
}
function toolbar(){
  const tg = p => () => { S.panel = S.panel === p ? null : p; render(); };
  const items = [
    ["globe", "ভাষা বদলান", false, switchLang],
    ["smile", "ইমোজি", S.panel === "emoji", tg("emoji")],
    ["clip", "ক্লিপবোর্ড", S.panel === "clip", tg("clip")],
    ["palette", "থিম", S.panel === "theme", tg("theme")],
    ["font", "ফন্ট", S.panel === "font", tg("font")],
    ["dots", "আরও", S.panel === "more", tg("more")],
    ["mic", "ভয়েস টাইপিং", S.listen, voice]
  ];
  const tb = el("div", "tb");
  items.forEach(([i, a, on, fn]) => {
    const b = el("button", on ? "on" : ""); b.type = "button"; b.innerHTML = ic(i);
    b.setAttribute("aria-label", a); b.onclick = fn; tb.appendChild(b);
  });
  return tb;
}
function render(){
  closePop(); kb.innerHTML = "";
  S.mond = S.theme === "mondrian" && S.lang === "en" && !S.panel;
  kb.className = "kb" + (S.mond ? " mond" : "");
  kb.appendChild(toolbar());
  if (S.panel) panelBody(); else mainRows();
}
out.addEventListener("copy", () => addClip(out.value.slice(out.selectionStart, out.selectionEnd)));
out.addEventListener("cut", () => addClip(out.value.slice(out.selectionStart, out.selectionEnd)));
render();
</script>
</body>
</html>
